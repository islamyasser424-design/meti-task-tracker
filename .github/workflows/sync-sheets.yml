name: Sync Google Sheets to Cloudflare D1 Database

on:
  workflow_dispatch:        # Manual trigger only (Automated sync is executed natively every 5 min by Cloudflare Worker cron)

concurrency:
  group: sync-sheets-job
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run sync script
        env:
          SYNC_TARGET: 'd1'
          API_SYNC_URL: ${{ secrets.API_SYNC_URL || 'https://meeg-secure-api.islamyasser424.workers.dev/api/sync-sheets' }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN || 'meeg_internal_sync_secure_token_2026' }}
        run: |
          python scripts/sync_sheets.py
