name: Test isolated Turso rebuild
on:
  pull_request:
    paths: ['rebuild/**', '.github/workflows/rebuild-ci.yml']
  push:
    branches: ['codex/secure-turso-rebuild']
    paths: ['rebuild/**', '.github/workflows/rebuild-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rebuild/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm run test:runtime
      - run: npm run test:dom
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-rebuild-validation
          path: |
            rebuild/.local/screenshots/
            rebuild/.local/benchmark.json
          retention-days: 7
