<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a101d" />
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="tursoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <filter id="glowTeal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Marker Arrows -->
    <marker id="arrTeal" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#14b8a6" />
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#38bdf8" />
    </marker>
    <marker id="arrPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#a855f7" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="620" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="0" y1="560" x2="1200" y2="560" />
    <line x1="160" y1="0" x2="160" y2="620" />
    <line x1="360" y1="0" x2="360" y2="620" />
    <line x1="560" y1="0" x2="560" y2="620" />
    <line x1="760" y1="0" x2="760" y2="620" />
    <line x1="960" y1="0" x2="960" y2="620" />
  </g>

  <!-- Header Section -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="46" height="46" rx="12" fill="url(#tealGrad)" />
    <text x="23" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">M</text>
    
    <text x="60" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">METI Task Tracker</text>
    <text x="60" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Autonomous Driving Annotation Pipeline &amp; Edge Synchronization Architecture</text>
    
    <!-- Status Badges -->
    <rect x="880" y="4" width="115" height="28" rx="14" fill="#134e4a" stroke="#14b8a6" stroke-width="1.2" />
    <circle cx="894" cy="18" r="4" fill="#34d399" />
    <text x="946" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#5eead4" text-anchor="middle">Turso LibSQL</text>

    <rect x="1005" y="4" width="75" height="28" rx="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2" />
    <text x="1042" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#c7d2fe" text-anchor="middle">15m Cron</text>
  </g>

  <!-- COLUMN 1: Ingestion & Frontends -->
  <g transform="translate(60, 130)">
    <!-- Box 1A: Annotator Portal -->
    <rect x="0" y="0" width="280" height="200" rx="14" fill="url(#cardGradDark)" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="280" height="6" rx="3" fill="url(#blueGrad)" />
    <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Annotator Terminal</text>
    <text x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#38bdf8">index.html (Zero-Build Vanilla Client)</text>

    <g transform="translate(20, 72)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#cbd5e1">
      <text x="0" y="0">✦ Regex URL Auto-Parser (Robot Car)</text>
      <text x="0" y="22">✦ Auto-extracts Task ID, Pass, Stage</text>
      <text x="0" y="44">✦ Shift, PC No, Yubikey, QTC Reviewer</text>
      <text x="0" y="66">✦ Live Session Counter with Undo</text>
      <text x="0" y="88">✦ PIN-Protected (2026) Local Export</text>
      <text x="0" y="110" fill="#38bdf8" font-weight="600">⚡ Direct Edge HTTP Pipeline</text>
    </g>

    <!-- Box 1B: Google Sheets Source -->
    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="280" height="180" rx="14" fill="url(#cardGradDark)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)" />
      <rect x="0" y="0" width="280" height="6" rx="3" fill="url(#tealGrad)" />
      <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Operational Google Sheets</text>
      <text x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#34d399">Historical Archives &amp; Live Tracking</text>

      <g transform="translate(20, 74)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#cbd5e1">
        <text x="0" y="0">✦ Sheet 1: Main History (51,000+ Rows)</text>
        <text x="0" y="22">✦ Sheet 2: Daily Operations Active Sheet</text>
        <text x="0" y="44">✦ Google Visualization API (GViz) Query</text>
        <text x="0" y="66">✦ Headless Export without OAuth Bloat</text>
        <text x="0" y="88" fill="#34d399" font-weight="600">🔄 Read-Only Public GViz Feed</text>
      </g>
    </g>
  </g>

  <!-- COLUMN 2: Sync Engine & Processing -->
  <g transform="translate(410, 130)">
    <!-- GitHub Actions & Python Sync -->
    <rect x="0" y="0" width="270" height="410" rx="14" fill="url(#cardGradDark)" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="270" height="6" rx="3" fill="url(#purpleGrad)" />
    <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">ETL &amp; Sync Engine</text>
    <text x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#c084fc">GitHub Actions + sync_sheets.py</text>

    <!-- Inner Workflow Block -->
    <rect x="16" y="74" width="238" height="64" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <text x="28" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e0e7ff">Cron Runner (15m Interval)</text>
    <text x="28" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#a5b4fc">.github/workflows/sync-sheets.yml</text>
    <text x="28" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#818cf8">+ Manual workflow_dispatch</text>

    <!-- Pipeline steps -->
    <g transform="translate(20, 160)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#cbd5e1">
      <text x="0" y="0" font-weight="600" fill="#f1f5f9">1. GViz Data Extraction</text>
      <text x="12" y="18" fill="#94a3b8">Fetch latest 300 rows (Sheet 1)</text>
      <text x="12" y="34" fill="#94a3b8">Fetch latest 100 rows (Sheet 2)</text>

      <text x="0" y="62" font-weight="600" fill="#f1f5f9">2. Dynamic Metadata Discovery</text>
      <text x="12" y="80" fill="#94a3b8">Detects unseen Queue names</text>
      <text x="12" y="96" fill="#94a3b8">Detects newly added QTC members</text>

      <text x="0" y="124" font-weight="600" fill="#f1f5f9">3. Micro-Batching &amp; Resilience</text>
      <text x="12" y="142" fill="#94a3b8">Chunks 50 statements / call</text>
      <text x="12" y="158" fill="#94a3b8">4-step exponential backoff retry</text>
      <text x="12" y="174" fill="#94a3b8">Zero-failure execution safety</text>
      
      <text x="0" y="202" fill="#a855f7" font-weight="700">INSERT OR IGNORE deduplication</text>
    </g>
  </g>

  <!-- COLUMN 3: Turso Edge Database -->
  <g transform="translate(750, 130)">
    <rect x="0" y="0" width="390" height="195" rx="14" fill="url(#cardGradDark)" stroke="#10b981" stroke-width="1.8" filter="url(#shadow)" />
    <rect x="0" y="0" width="390" height="6" rx="3" fill="url(#tursoGrad)" />
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">Turso LibSQL Edge Database</text>
    <text x="24" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399">AWS EU-West-1 (Ireland) · Sub-50ms Global Querying</text>

    <!-- Schema Badges -->
    <g transform="translate(24, 76)">
      <rect x="0" y="0" width="165" height="42" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1" />
      <text x="10" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">task_submissions</text>
      <text x="10" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#6ee7b7">51,000+ Indexed Records</text>

      <rect x="180" y="0" width="165" height="42" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1" />
      <text x="10" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">custom_queues &amp; qtc</text>
      <text x="10" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#6ee7b7">Dynamic Taxonomy Cache</text>
    </g>

    <!-- Critical Constraint Highlight -->
    <rect x="24" y="132" width="342" height="44" rx="8" fill="#0f2b24" stroke="#10b981" stroke-dasharray="4,3" />
    <text x="36" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#34d399">🔒 ATOMIC DEDUPLICATION CONSTRAINT:</text>
    <text x="36" y="166" font-family="'Courier New', monospace" font-size="11.5" font-weight="700" fill="#ffffff">UNIQUE(task_id, pass, yubikey_email)</text>
  </g>

  <!-- COLUMN 3 Lower: Admin & Operational Dashboard -->
  <g transform="translate(750, 345)">
    <rect x="0" y="0" width="390" height="195" rx="14" fill="url(#cardGradDark)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="390" height="6" rx="3" fill="url(#amberGrad)" />
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Operational Analytics Dashboard</text>
    <text x="24" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#fbbf24">dashboard.html (Admin &amp; Supervisor Control)</text>

    <g transform="translate(24, 76)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#cbd5e1">
      <text x="0" y="0">✦ Real-time Shift KPIs &amp; Throughput Metrics</text>
      <text x="0" y="20">✦ Team &amp; Queue Breakdown Visualizations</text>
      <text x="0" y="40">✦ Search, Filter &amp; Paginated Query Engine</text>
      <text x="0" y="60">✦ Inline Task Submission Editing Modal</text>
      <text x="0" y="80">✦ User Role &amp; Permissions Authorization</text>
      <text x="0" y="100" fill="#fbbf24" font-weight="600">📥 UTF-8 BOM CSV Export (Arabic Excel Ready)</text>
    </g>
  </g>

  <!-- INTERCONNECTION ARROWS & PATHS -->
  <!-- 1. Annotator direct to Turso -->
  <path d="M 340 220 C 500 220, 580 180, 750 180" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrBlue)" />
  <rect x="490" y="188" width="115" height="20" rx="4" fill="#082f49" stroke="#0284c7" stroke-width="0.8" />
  <text x="547" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#bae6fd" text-anchor="middle">HTTP POST (LibSQL)</text>

  <!-- 2. Google Sheets to Python ETL -->
  <path d="M 340 450 L 410 450" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrTeal)" />

  <!-- 3. Python ETL to Turso -->
  <path d="M 680 250 L 750 250" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrPurple)" />
  <rect x="682" y="235" width="65" height="18" rx="4" fill="#3b0764" stroke="#a855f7" stroke-width="0.8" />
  <text x="714" y="247" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#f3e8ff" text-anchor="middle">Batch Sync</text>

  <!-- 4. Turso to Dashboard -->
  <path d="M 945 325 L 945 345" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrTeal)" />

  <!-- Footer Info -->
  <g transform="translate(60, 580)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#64748b">Architecture: Serverless LibSQL Edge · Zero Client Build Step · Automated Google Visualization ETL · Zero Data Duplication</text>
    <text x="1080" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8" text-anchor="end">METI Operations · Islam Yasser</text>
  </g>
</svg>
